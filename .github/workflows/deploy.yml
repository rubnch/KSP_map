name: Deploy to GitHub Pages

# Everything is served from the gh-pages branch
# (Pages: "Deploy from a branch: gh-pages / (root)"):
#   main -> site root         https://<owner>.github.io/<repo>/
#   dev  -> dev/ subfolder    https://<owner>.github.io/<repo>/dev/
#   PRs  -> pr-preview/pr-N/  (see preview.yml)
# Each deploy only replaces its own folder.

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Deploy main to the site root
        if: github.ref_name == 'main'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          clean-exclude: |
            pr-preview/
            dev/
          force: false
      - name: Deploy dev to /dev/
        if: github.ref_name == 'dev'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          target-folder: dev
          force: false
